spring:
  application:
    name: harvex
  profiles:
    default: standalone
  datasource:
    url: jdbc:h2:file:./data/harvex;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: manual
  thymeleaf:
    cache: false
management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /api
harvex:
  profile: standalone
  role: all
  queue:
    backend: local
  database:
    backend: h2
  artifacts:
    backend: filesystem
    path: data/artifacts
  index:
    backend: lucene
    path: data/index
    endpoint: http://localhost:9200
    prefix: harvex
  embeddings:
    enabled: ${HARVEX_EMBEDDINGS_ENABLED:true}
    provider: ${HARVEX_EMBEDDINGS_PROVIDER:local}
    local:
      model-id: ${HARVEX_EMBEDDINGS_LOCAL_MODEL_ID:Xenova/multilingual-e5-small}
      revision: ${HARVEX_EMBEDDINGS_LOCAL_REVISION:97cb8f96eaed1a1f0dac821239943e854fce9c36}
      download-url: ${HARVEX_EMBEDDINGS_LOCAL_DOWNLOAD_URL:https://huggingface.co/Xenova/multilingual-e5-small/resolve/97cb8f96eaed1a1f0dac821239943e854fce9c36}
      cache-path: ${HARVEX_EMBEDDINGS_LOCAL_CACHE_PATH:data/models}
      model-path: ${HARVEX_EMBEDDINGS_LOCAL_MODEL_PATH:}
      download-timeout-seconds: ${HARVEX_EMBEDDINGS_LOCAL_DOWNLOAD_TIMEOUT_SECONDS:120}
    openai-compatible:
      base-url: ${HARVEX_EMBEDDINGS_OPENAI_COMPATIBLE_BASE_URL:}
      model: ${HARVEX_EMBEDDINGS_OPENAI_COMPATIBLE_MODEL:}
      api-key: ${HARVEX_EMBEDDINGS_OPENAI_COMPATIBLE_API_KEY:}
      headers: ${HARVEX_EMBEDDINGS_OPENAI_COMPATIBLE_HEADERS:}
      dimensions: ${HARVEX_EMBEDDINGS_OPENAI_COMPATIBLE_DIMENSIONS:1536}
      timeout-seconds: ${HARVEX_EMBEDDINGS_OPENAI_COMPATIBLE_TIMEOUT_SECONDS:30}
  retrieval:
    default-mode: ${HARVEX_RETRIEVAL_DEFAULT_MODE:hybrid}
    hybrid-fusion: rrf
    rrf-constant: ${HARVEX_RETRIEVAL_RRF_CONSTANT:60}
    candidate-limit: ${HARVEX_RETRIEVAL_CANDIDATE_LIMIT:100}
  answering:
    enabled: ${HARVEX_ANSWERING_ENABLED:false}
    provider: openai-compatible
    retrieval-mode: ${HARVEX_ANSWERING_RETRIEVAL_MODE:hybrid}
    source-limit: ${HARVEX_ANSWERING_SOURCE_LIMIT:8}
    context-token-budget: ${HARVEX_ANSWERING_CONTEXT_TOKEN_BUDGET:6000}
    max-history-messages: ${HARVEX_ANSWERING_MAX_HISTORY_MESSAGES:10}
    temperature: ${HARVEX_ANSWERING_TEMPERATURE:0.2}
    max-output-tokens: ${HARVEX_ANSWERING_MAX_OUTPUT_TOKENS:800}
    openai-compatible:
      base-url: ${HARVEX_ANSWERING_OPENAI_COMPATIBLE_BASE_URL:}
      model: ${HARVEX_ANSWERING_OPENAI_COMPATIBLE_MODEL:}
      api-key: ${HARVEX_ANSWERING_OPENAI_COMPATIBLE_API_KEY:}
      headers: ${HARVEX_ANSWERING_OPENAI_COMPATIBLE_HEADERS:}
      timeout-seconds: ${HARVEX_ANSWERING_OPENAI_COMPATIBLE_TIMEOUT_SECONDS:60}
  worker:
    concurrency: 8
    lease-seconds: 30
    max-attempts: 5
  security:
    initial-admin-email: ${HARVEX_ADMIN_EMAIL:admin@harvex.local}
    initial-admin-password: ${HARVEX_ADMIN_PASSWORD:admin}
server:
  error:
    include-message: always
---
spring:
  config:
    activate:
      on-profile: distributed
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/harvex}
    username: ${SPRING_DATASOURCE_USERNAME:harvex}
    password: ${SPRING_DATASOURCE_PASSWORD:harvex}
harvex:
  profile: distributed
  role: ${HARVEX_ROLE:control-plane}
  queue:
    backend: rabbitmq
  database:
    backend: postgresql
  artifacts:
    backend: s3
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:harvex}
    prefix: ${S3_PREFIX:artifacts}
  index:
    backend: opensearch
    endpoint: ${OPENSEARCH_ENDPOINT:http://localhost:9200}
    prefix: ${OPENSEARCH_PREFIX:harvex}
management:
  health:
    rabbit:
      enabled: true
