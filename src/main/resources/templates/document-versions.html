<!doctype html><html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document versions · ContextCrate</title><link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/webjars/bootstrap-icons/font/bootstrap-icons.css"><link rel="stylesheet" href="/css/contextcrate.css"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container-fluid p-4 p-lg-5"><p class="eyebrow">DOCUMENT HISTORY</p><h1 th:text="${document.title ?: '(untitled)'}"></h1><p class="text-secondary text-break" th:text="${document.sourceUri}"></p><div class="card panel table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Version</th><th>Created</th><th>Run</th><th>Current</th></tr></thead><tbody><tr th:each="version:${versions}"><td th:text="|v${version.versionNumber}|"></td><td th:text="${version.createdAt}"></td><td th:text="${version.runId}"></td><td><i class="bi" th:classappend="${version.currentVersion} ? 'bi-check-circle-fill text-success' : 'bi-clock-history text-secondary'"></i></td></tr></tbody></table></div><a class="btn btn-outline-secondary mt-3" th:href="@{/crates/{id}/documents(id=${crate.id})}">Back to documents</a></main></body></html>
