<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extractions · ContextCrate</title><link rel="stylesheet" href="/css/contextcrate.css"><script defer src="/js/contextcrate.js"></script></head><body><aside th:replace="~{fragments :: sidebar}"></aside><div th:replace="~{fragments :: overlay}"></div><header th:replace="~{fragments :: topbar('Workspace')}"></header><main class="container-fluid p-4 p-lg-5"><p class="eyebrow">CHUNK MATCHES</p><h1 class="mb-4">Extractions</h1><div class="row g-4"><section class="col-xl-4" th:if="${crateRole.includes(T(tech.wenisch.contextcrate.domain.CrateMember.Role).EDITOR)}"><div class="card panel p-4"><h2 class="h5 mb-3">Create rule</h2><form method="post" th:action="@{/crates/{id}/extractions/rules(id=${crate.id})}" class="vstack gap-3"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div><label class="form-label">Name</label><input class="form-control" name="name" placeholder="IP addresses" required></div><div><label class="form-label">Type</label><select class="form-select" name="type"><option th:each="type:${types}" th:value="${type}" th:text="${type}"></option></select></div><div><label class="form-label">Pattern</label><textarea class="form-control" name="pattern" rows="4" placeholder="Required for REGEX rules"></textarea></div><div class="form-check"><input class="form-check-input" type="checkbox" name="enabled" value="true" id="enabled" checked><label class="form-check-label" for="enabled">Enabled</label></div><button class="btn btn-primary">Create rule</button></form></div><div class="card panel p-4 mt-4"><h2 class="h5 mb-3">Rebuild run</h2><form th:each="run:${runs}" th:action="@{/crates/{crateId}/extractions/runs/{id}/rebuild(crateId=${crate.id},id=${run.id})}" method="post" class="d-flex align-items-center justify-content-between gap-3 border-top py-2"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><span class="small text-truncate" th:text="${run.id}"></span><button class="btn btn-sm btn-outline-secondary">Rebuild</button></form><p th:if="${runs.empty}" class="empty-state mb-0">Runs will appear here after crawling.</p></div></section><section class="col-xl-8"><div class="card panel table-responsive mb-4"><table class="table align-middle mb-0"><thead><tr><th>Rule</th><th>Type</th><th>Status</th><th>Matches</th><th></th></tr></thead><tbody><tr th:each="rule:${rules}"><td th:text="${rule.name}"></td><td><code th:text="${rule.type}"></code></td><td><span class="badge" th:classappend="${rule.enabled} ? ' text-bg-success' : ' text-bg-secondary'" th:text="${rule.enabled} ? 'Enabled' : 'Disabled'"></span></td><td th:text="${extraction.countResults(rule.id)}"></td><td class="text-end"><form th:action="@{/crates/{crateId}/extractions/rules/{id}/disable(crateId=${crate.id},id=${rule.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-secondary" th:disabled="${!rule.enabled}">Disable</button></form></td></tr><tr th:if="${rules.empty}"><td colspan="5" class="empty-state">Create a rule to start extracting matches from chunks.</td></tr></tbody></table></div><div class="card panel table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Match</th><th>Chunk</th><th>Context</th><th>Extracted</th></tr></thead><tbody><tr th:each="result:${results.content}"><td><code th:text="${result.matchedValue}"></code></td><td><span th:text="${result.chunkOrdinal}"></span></td><td class="small"><span th:text="${result.contextBefore}"></span><mark th:text="${result.matchedValue}"></mark><span th:text="${result.contextAfter}"></span></td><td class="small" th:text="${result.extractedAt}"></td></tr><tr th:if="${results.empty}"><td colspan="4" class="empty-state">Extraction results will appear here after rules run.</td></tr></tbody></table></div></section></div></main></body></html>
