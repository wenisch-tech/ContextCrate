<!doctype html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documents · ContextCrate</title><link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/webjars/bootstrap-icons/font/bootstrap-icons.css"><link rel="stylesheet" href="/css/contextcrate.css"></head>
<body><nav th:replace="~{fragments :: nav}"></nav><main class="container-fluid p-4 p-lg-5">
  <p class="eyebrow">NORMALIZED CONTENT</p>
  <div class="d-flex align-items-start justify-content-between gap-3 mb-2"><div><h1 class="mb-1">Documents</h1><p class="text-secondary mb-0">Normalized, versioned source content that ContextCrate indexes and uses as retrieval context.</p></div>
    <form th:if="${unindexedCount > 0}" method="post" th:action="@{/crates/{crateId}/documents/retry-unindexed(crateId=${crate.id})}"><input type="hidden" name="q" th:value="${query}"><input type="hidden" name="sort" th:value="${sort}"><input type="hidden" name="direction" th:value="${direction}"><input type="hidden" name="page" th:value="${documentPage.number}"><button class="btn btn-outline-warning" type="submit"><i class="bi bi-arrow-repeat me-1"></i>Index missing (<span th:text="${unindexedCount}"></span>)</button></form>
  </div>
  <div class="alert alert-info mt-3" th:if="${indexRecoveryMessage}" th:text="${indexRecoveryMessage}"></div>
  <form class="row g-2 my-4" method="get" th:action="@{/crates/{crateId}/documents(crateId=${crate.id})}"><div class="col-sm-8 col-md-6"><label class="visually-hidden" for="document-search">Search documents</label><input id="document-search" class="form-control" name="q" type="search" placeholder="Search title or source URI" th:value="${query}"></div><input type="hidden" name="sort" th:value="${sort}"><input type="hidden" name="direction" th:value="${direction}"><div class="col-auto"><button class="btn btn-primary" type="submit"><i class="bi bi-search me-1"></i>Search</button></div><div class="col-auto" th:if="${!query.isBlank()}"><a class="btn btn-outline-secondary" th:href="@{/crates/{crateId}/documents(crateId=${crate.id},sort=${sort},direction=${direction})}">Clear</a></div></form>
  <div class="card panel table-responsive"><table class="table align-middle mb-0"><thead><tr>
    <th><a th:href="@{/crates/{crateId}/documents(crateId=${crate.id},q=${query},sort='title',direction=${nextDirections.get('title')},page=0)}">Title</a></th>
    <th><a th:href="@{/crates/{crateId}/documents(crateId=${crate.id},q=${query},sort='uri',direction=${nextDirections.get('uri')},page=0)}">Source URI</a></th><th>Version</th><th>Language</th>
    <th><a th:href="@{/crates/{crateId}/documents(crateId=${crate.id},q=${query},sort='chunks',direction=${nextDirections.get('chunks')},page=0)}">Chunks</a></th>
    <th><a th:href="@{/crates/{crateId}/documents(crateId=${crate.id},q=${query},sort='indexed',direction=${nextDirections.get('indexed')},page=0)}">Index</a></th>
  </tr></thead><tbody>
    <tr th:each="row:${documentPage.content}" th:with="doc=${row.document}">
      <td><a th:href="@{/crates/{crateId}/documents/{id}(crateId=${crate.id},id=${doc.id})}" th:text="${doc.title ?: '(untitled)'}"></a></td>
      <td><span th:text="${doc.sourceUri}" class="text-truncate d-inline-block url-cell"></span></td>
      <td th:text="|v${doc.versionNumber}|"></td><td th:text="${doc.language ?: '—'}"></td><td th:text="${row.chunkCount}"></td>
      <td><i class="bi" th:classappend="${doc.indexed} ? 'bi-check-circle-fill text-success' : 'bi-clock text-warning'"></i><span class="visually-hidden" th:text="${doc.indexed ? 'Indexed' : 'Not indexed'}"></span></td>
    </tr>
    <tr th:if="${documentPage.empty}"><td colspan="6" class="empty-state" th:text="${query.isBlank() ? 'Normalized documents will appear here.' : 'No documents match your search.'}"></td></tr>
  </tbody></table></div>
  <nav class="mt-3 d-flex justify-content-between align-items-center" th:if="${documentPage.totalPages > 1}"><span class="text-secondary small" th:text="|Page ${documentPage.number + 1} of ${documentPage.totalPages} (${documentPage.totalElements} documents)|"></span><div class="btn-group"><a class="btn btn-outline-secondary" th:classappend="${documentPage.first} ? ' disabled'" th:href="@{/crates/{crateId}/documents(crateId=${crate.id},q=${query},sort=${sort},direction=${direction},page=${documentPage.number - 1})}">Previous</a><a class="btn btn-outline-secondary" th:classappend="${documentPage.last} ? ' disabled'" th:href="@{/crates/{crateId}/documents(crateId=${crate.id},q=${query},sort=${sort},direction=${direction},page=${documentPage.number + 1})}">Next</a></div></nav>
</main></body></html>
