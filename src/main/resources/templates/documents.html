<!doctype html><html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documents · Harvex</title><link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/webjars/bootstrap-icons/font/bootstrap-icons.css"><link rel="stylesheet" href="/css/harvex.css"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container-fluid p-4 p-lg-5"><p class="eyebrow">NORMALIZED CONTENT</p><h1 class="mb-4">Documents</h1><div class="card panel table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Title</th><th>URL</th><th>Language</th><th>Index</th></tr></thead><tbody><tr th:each="doc:${documents}"><td th:text="${doc.title ?: '(untitled)'}"></td><td><a th:href="${doc.canonicalUrl}" th:text="${doc.canonicalUrl}" target="_blank" class="text-truncate d-inline-block url-cell"></a></td><td th:text="${doc.language ?: '—'}"></td><td><i class="bi" th:classappend="${doc.indexed} ? 'bi-check-circle-fill text-success' : 'bi-clock text-warning'"></i></td></tr><tr th:if="${documents.empty}"><td colspan="4" class="empty-state">Parsed documents will appear here.</td></tr></tbody></table></div></main></body></html>
