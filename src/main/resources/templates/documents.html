<!doctype html><html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documents · ContextCrate</title><link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/webjars/bootstrap-icons/font/bootstrap-icons.css"><link rel="stylesheet" href="/css/contextcrate.css"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container-fluid p-4 p-lg-5"><p class="eyebrow">NORMALIZED CONTENT</p><div class="d-flex align-items-center justify-content-between mb-4"><h1 class="mb-0">Documents</h1><form th:if="${unindexedCount > 0}" method="post" th:action="@{/crates/{crateId}/documents/retry-unindexed(crateId=${crate.id})}"><button class="btn btn-outline-warning" type="submit"><i class="bi bi-arrow-repeat me-1"></i>Index missing (<span th:text="${unindexedCount}"></span>)</button></form></div><div class="alert alert-info" th:if="${indexRecoveryMessage}" th:text="${indexRecoveryMessage}"></div><div class="card panel table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Title</th><th>Source URI</th><th>Language</th><th>Chunks</th><th>Index</th></tr></thead><tbody><tr th:each="doc:${documents}"><td th:text="${doc.title ?: '(untitled)'}"></td><td><span th:text="${doc.sourceUri}" class="text-truncate d-inline-block url-cell"></span></td><td th:text="${doc.language ?: '—'}"></td><td th:text="${chunkCounts.getOrDefault(doc.id, 0)}"></td><td><i class="bi" th:classappend="${doc.indexed} ? 'bi-check-circle-fill text-success' : 'bi-clock text-warning'"></i></td></tr><tr th:if="${documents.empty}"><td colspan="5" class="empty-state">Normalized documents will appear here.</td></tr></tbody></table></div></main></body></html>
