<!doctype html><html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Source · ContextCrate</title><link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/css/contextcrate.css"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container py-5"><p class="eyebrow">SOURCE</p><h1 th:text="${source == null ? 'Create source' : 'Edit source'}"></h1><form class="card panel mt-4" method="post" th:action="${source == null ? '/crates/'+crate.id+'/sources' : '/crates/'+crate.id+'/sources/'+source.id+'/update'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="card-body p-4 row g-3"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" required th:value="${source?.name}"></div><div class="col-md-6" th:if="${source == null}"><label class="form-label">Type</label><select class="form-select" name="connectorType"><option th:each="type:${connectorTypes}" th:value="${type}" th:text="${type == T(tech.wenisch.contextcrate.domain.ConnectorType).HTTPS ? 'HTTPS website' : 'Git repository'}"></option></select></div><div class="col-12"><label class="form-label">URL</label><input class="form-control" type="text" name="endpoint" required th:value="${source == null ? '' : (source.connectorType.name() == 'GIT' ? config.git.repositoryUrl : config.website.url)}"><div class="form-text">The URL is stored as entered and checked when a job runs.</div></div><div class="col-12"><label class="form-label">Description <span class="text-secondary">(optional)</span></label><textarea class="form-control" name="description" rows="2" maxlength="2000" th:text="${source?.description}"></textarea></div></div><div class="card-footer text-end"><button class="btn btn-primary">Save source</button></div></form></main></body></html>
