<!doctype html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit crawl job · ContextCrate</title><link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/webjars/bootstrap-icons/font/bootstrap-icons.css"><link rel="stylesheet" href="/css/contextcrate.css"></head>
<body><nav th:replace="~{fragments :: nav}"></nav><main class="container py-5"><p class="eyebrow">CONFIGURATION</p><h1 class="mb-4">Edit crawl job</h1>
<form th:action="@{/crates/{crateId}/jobs/{id}/update(crateId=${crate.id},id=${job.id})}" method="post" class="card panel"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="card-body p-4">
<h2 class="section-title"><span>1</span> Scope</h2><div class="row g-3"><div class="col-md-6"><label class="form-label" for="name">Job name</label><input id="name" class="form-control" name="name" th:value="${job.name}" required></div><div class="col-md-6"><label class="form-label" for="seedUrl">Seed URL</label><input id="seedUrl" class="form-control" name="seedUrl" type="url" th:value="${config.scope().seedUrl()}" required></div><div class="col-md-5"><label class="form-label" for="allowedHost">Allowed host</label><input id="allowedHost" class="form-control" name="allowedHost" th:value="${config.scope().allowedHosts().iterator().next()}" required></div><div class="col-md-2"><label class="form-label" for="maxDepth">Depth</label><input id="maxDepth" class="form-control" name="maxDepth" type="number" min="0" th:value="${config.scope().maxDepth()}"></div><div class="col-md-3"><label class="form-label" for="maxPages">Maximum pages</label><input id="maxPages" class="form-control" name="maxPages" type="number" min="1" th:value="${config.scope().maxPages()}"></div><div class="col-md-2 d-flex align-items-end"><div class="form-check mb-2"><input class="form-check-input" name="allowSubdomains" type="checkbox" value="true" id="subdomains" th:checked="${config.scope().allowSubdomains()}"><label class="form-check-label" for="subdomains">Subdomains</label></div></div></div><hr class="my-4">
<h2 class="section-title"><span>2</span> Politeness</h2><div class="row g-3"><div class="col-md-4"><label class="form-label" for="userAgent">User agent</label><input id="userAgent" class="form-control" name="userAgent" th:value="${config.politeness().userAgent()}"></div><div class="col-md-4"><label class="form-label" for="contact">Operator contact</label><input id="contact" class="form-control" name="contact" th:value="${config.politeness().contact()}"></div><div class="col-md-2"><label class="form-label" for="delayMillis">Delay (ms)</label><input id="delayMillis" class="form-control" name="delayMillis" type="number" min="0" th:value="${config.politeness().minimumDelayMillis()}"></div><div class="col-md-2"><label class="form-label" for="timeoutMillis">Timeout (ms)</label><input id="timeoutMillis" class="form-control" name="timeoutMillis" type="number" min="100" th:value="${config.politeness().timeoutMillis()}"></div><div class="col-12"><div class="form-check"><input class="form-check-input" name="honorRobots" value="true" type="checkbox" id="robots" th:checked="${config.politeness().honorRobots()}"><label class="form-check-label" for="robots">Honor robots.txt (recommended)</label></div></div></div><hr class="my-4">
<h2 class="section-title"><span>3</span> Reliability</h2><div class="row g-3"><div class="col-md-3"><label class="form-label" for="maxAttempts">Attempts</label><input id="maxAttempts" class="form-control" name="maxAttempts" type="number" min="1" th:value="${config.reliability().maxAttempts()}"></div><div class="col-md-3"><label class="form-label" for="backoffMillis">Initial backoff (ms)</label><input id="backoffMillis" class="form-control" name="backoffMillis" type="number" min="0" th:value="${config.reliability().initialBackoffMillis()}"></div><div class="col-md-3"><label class="form-label" for="maxBodyMegabytes">Maximum body (MB)</label><input id="maxBodyMegabytes" class="form-control" name="maxBodyMegabytes" type="number" min="1" th:value="${config.reliability().maxBodyBytes() / 1000000}"></div><div class="col-md-3"><label class="form-label" for="renderMode">Rendering</label><select id="renderMode" class="form-select" name="renderMode"><option th:selected="${config.reliability().renderMode() == T(tech.wenisch.contextcrate.domain.CrawlConfiguration.RenderMode).HTTP_ONLY}">HTTP_ONLY</option><option th:selected="${config.reliability().renderMode() == T(tech.wenisch.contextcrate.domain.CrawlConfiguration.RenderMode).BROWSER_ONLY}">BROWSER_ONLY</option><option th:selected="${config.reliability().renderMode() == T(tech.wenisch.contextcrate.domain.CrawlConfiguration.RenderMode).AUTO}">AUTO</option></select></div></div><hr class="my-4">
<h2 class="section-title"><span>4</span> Output</h2><div class="row g-3"><div class="col-md-3"><label class="form-label" for="retentionDays">Raw retention (days)</label><input id="retentionDays" class="form-control" name="retentionDays" type="number" min="0" th:value="${config.output().rawRetentionDays()}"></div><div class="col-md-3"><label class="form-label" for="contentSelector">Content selector</label><input id="contentSelector" class="form-control" name="contentSelector" th:value="${config.output().contentSelector()}"></div><div class="col-md-3"><label class="form-label" for="chunkSize">Chunk size</label><input id="chunkSize" class="form-control" name="chunkSize" type="number" min="200" th:value="${config.output().chunkSize()}"></div><div class="col-md-3"><label class="form-label" for="chunkOverlap">Chunk overlap</label><input id="chunkOverlap" class="form-control" name="chunkOverlap" type="number" min="0" th:value="${config.output().chunkOverlap()}"></div></div><hr class="my-4">
<h2 class="section-title"><span>5</span> Authentication</h2><div class="mb-3"><label class="form-label">Authentication method</label><div class="form-check"><input type="radio" class="form-check-input" id="authMethodNone" name="authMethod" value="NONE" th:checked="${config.loginConfiguration().authMethod() == T(tech.wenisch.contextcrate.domain.CrawlConfiguration$AuthMethod).NONE}"><label class="form-check-label" for="authMethodNone">No authentication</label></div><div class="form-check"><input type="radio" class="form-check-input" id="authMethodForm" name="authMethod" value="FORM" th:checked="${config.loginConfiguration().authMethod() == T(tech.wenisch.contextcrate.domain.CrawlConfiguration$AuthMethod).FORM}"><label class="form-check-label" for="authMethodForm">Form-based authentication</label></div><div class="form-check"><input type="radio" class="form-check-input" id="authMethodOAuth2" name="authMethod" value="OAUTH2" th:checked="${config.loginConfiguration().authMethod() == T(tech.wenisch.contextcrate.domain.CrawlConfiguration$AuthMethod).OAUTH2}"><label class="form-check-label" for="authMethodOAuth2">Keycloak OAuth2 (service account or direct access)</label></div></div>
<div id="formAuthFields" class="auth-method-fields" th:style="${config.loginConfiguration().authMethod() == T(tech.wenisch.contextcrate.domain.CrawlConfiguration$AuthMethod).FORM ? '' : 'display:none;'}"><div class="row g-3"><div class="col-md-4"><label class="form-label" for="formAuthUsername">Username</label><input id="formAuthUsername" class="form-control" name="formAuthUsername" th:value="${config.loginConfiguration().authMethod() == T(tech.wenisch.contextcrate.domain.CrawlConfiguration$AuthMethod).FORM ? config.loginConfiguration().username() : ''}"></div><div class="col-md-4"><label class="form-label" for="formAuthPassword">Password</label><input id="formAuthPassword" class="form-control" name="formAuthPassword" type="password" autocomplete="new-password" placeholder="Unchanged"></div><div class="col-md-4"><label class="form-label" for="authLoginPageUrl">Authentication entry URL</label><input id="authLoginPageUrl" class="form-control" name="authLoginPageUrl" type="url" th:value="${config.loginConfiguration().authMethod() == T(tech.wenisch.contextcrate.domain.CrawlConfiguration$AuthMethod).FORM ? config.loginConfiguration().loginPageUrl() : ''}"></div></div></div>
<div id="oauth2AuthFields" class="auth-method-fields" th:style="${config.loginConfiguration().authMethod() == T(tech.wenisch.contextcrate.domain.CrawlConfiguration$AuthMethod).OAUTH2 ? '' : 'display:none;'}"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="authServerUrl">Auth server URL</label><input class="form-control" id="authServerUrl" name="authServerUrl" th:value="${config.loginConfiguration().authMethod() == T(tech.wenisch.contextcrate.domain.CrawlConfiguration$AuthMethod).OAUTH2 ? config.loginConfiguration().authServerUrl() : ''}"></div><div class="col-md-3"><label class="form-label" for="authRealm">Realm</label><input class="form-control" id="authRealm" name="authRealm" th:value="${config.loginConfiguration().authMethod() == T(tech.wenisch.contextcrate.domain.CrawlConfiguration$AuthMethod).OAUTH2 ? config.loginConfiguration().realm() : ''}"></div><div class="col-md-3"><label class="form-label" for="authClientId">Client ID</label><input class="form-control" id="authClientId" name="authClientId" th:value="${config.loginConfiguration().authMethod() == T(tech.wenisch.contextcrate.domain.CrawlConfiguration$AuthMethod).OAUTH2 ? config.loginConfiguration().clientId() : ''}"></div><div class="col-md-4"><label class="form-label" for="authClientSecret">Client secret</label><input class="form-control" id="authClientSecret" name="authClientSecret" type="password" autocomplete="new-password" placeholder="Unchanged"></div><div class="col-md-4"><label class="form-label" for="oauthUsername">Username (password grant)</label><input class="form-control" id="oauthUsername" name="oauthUsername" th:value="${config.loginConfiguration().authMethod() == T(tech.wenisch.contextcrate.domain.CrawlConfiguration$AuthMethod).OAUTH2 ? config.loginConfiguration().username() : ''}"></div><div class="col-md-4"><label class="form-label" for="oauthPassword">Password (password grant)</label><input class="form-control" id="oauthPassword" name="oauthPassword" type="password" autocomplete="new-password" placeholder="Unchanged"></div></div></div>
</div><div class="card-footer d-flex justify-content-end gap-2 p-3"><a class="btn btn-outline-secondary" th:href="@{/crates/{id}/jobs(id=${crate.id})}">Cancel</a><button class="btn btn-primary">Update job</button></div></form>
<script>document.addEventListener('DOMContentLoaded',()=>{const n=document.getElementById('authMethodNone'),f=document.getElementById('authMethodForm'),o=document.getElementById('authMethodOAuth2'),ff=document.getElementById('formAuthFields'),of=document.getElementById('oauth2AuthFields');function toggle(){ff.style.display=f.checked?'':'none';of.style.display=o.checked?'':'none';}n.addEventListener('change',toggle);f.addEventListener('change',toggle);o.addEventListener('change',toggle);toggle();});</script>
</main></body></html>
