<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document diff · ContextCrate</title><link rel="stylesheet" href="/css/contextcrate.css"><script defer src="/js/contextcrate.js"></script></head>
<body><aside th:replace="~{fragments :: sidebar}"></aside><div th:replace="~{fragments :: overlay}"></div><header th:replace="~{fragments :: topbar('Workspace')}"></header><main class="container-fluid p-4 p-lg-5"><p class="eyebrow">VERSION DIFF</p><div class="d-flex justify-content-between align-items-start gap-3 mb-4"><div><h1 th:text="${document.title ?: '(untitled)'}"></h1><p class="text-secondary mb-0" th:text="|Comparing v${previous.versionNumber} to v${document.versionNumber}|"></p></div><a class="btn btn-outline-secondary" th:href="@{/crates/{crateId}/documents/{id}(crateId=${crate.id},id=${document.id})}">Back to document</a></div><div class="card panel"><div class="card-body"><pre class="mb-0"><code th:text="${diff}"></code></pre></div></div></main></body></html>
