<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Permissions · ContextCrate</title><link rel="stylesheet" href="/css/contextcrate.css"><script defer src="/js/contextcrate.js"></script></head>
<body><aside th:replace="~{fragments :: sidebar}"></aside><div th:replace="~{fragments :: overlay}"></div><header th:replace="~{fragments :: topbar('Workspace')}"></header><main class="container p-4 p-lg-5"><div class="mb-4"><p class="eyebrow">CRATE MANAGEMENT</p><h1 class="display-6 fw-semibold">Permissions</h1><p class="text-secondary">Manage who can access this crate and what they can do.</p></div><div class="alert alert-success" th:if="${param.memberSaved != null}">Member permissions saved.</div><div class="alert alert-danger" th:if="${param.error != null}" th:text="${param.error[0]}"></div>
  <section class="card panel table-responsive mb-4"><table class="table align-middle mb-0"><thead><tr><th>User</th><th>Role</th><th class="text-end">Action</th></tr></thead><tbody><tr th:each="view:${members}"><td th:text="${view.email}"></td><td><span class="badge" th:text="${view.member.role}"></span></td><td class="text-end"><form class="d-inline-flex gap-2" method="post" th:action="@{/crates/{crateId}/permissions/members/{userId}/role(crateId=${crate.id},userId=${view.member.userId})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select class="form-select form-select-sm" name="role"><option th:each="value:${roles}" th:value="${value}" th:text="${value}" th:selected="${value == view.member.role}"></option></select><button class="btn btn-sm btn-outline-secondary">Save</button></form></td></tr><tr th:if="${members.empty}"><td colspan="3" class="empty-state">No members.</td></tr></tbody></table></section>
  <form class="card panel p-4" method="post" th:action="@{/crates/{id}/permissions/members(id=${crate.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><h2 class="h5">Add member</h2><p class="text-secondary small">Enter the exact e-mail address of an existing account. Addresses are not searched or suggested.</p><div class="row g-3"><div class="col-md-7"><label class="form-label" for="member-email">E-mail address</label><input class="form-control" id="member-email" type="email" name="email" required maxlength="320" autocomplete="off"></div><div class="col-md-3"><label class="form-label" for="member-role">Role</label><select class="form-select" id="member-role" name="role"><option th:each="value:${roles}" th:value="${value}" th:text="${value}"></option></select></div></div><button class="btn btn-primary mt-4">Add member</button></form>
</main></body></html>
