<!doctype html><html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crawl jobs · Harvex</title><link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/webjars/bootstrap-icons/font/bootstrap-icons.css"><link rel="stylesheet" href="/css/harvex.css"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container-fluid p-4 p-lg-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><p class="eyebrow">CONFIGURATION</p><h1>Crawl jobs</h1></div><a class="btn btn-primary" href="/jobs/new">New crawl job</a></div><div class="row g-3"><div class="col-lg-6 col-xxl-4" th:each="job:${jobs}"><article class="card panel h-100"><div class="card-body"><div class="d-flex justify-content-between"><h2 class="h5" th:text="${job.name}"></h2><span class="badge text-bg-success" th:if="${job.enabled}">Enabled</span></div><p class="text-secondary text-truncate" th:text="${codec.read(job.configurationJson).scope.seedUrl}"></p><div class="small text-secondary"><span th:text="|Depth ${codec.read(job.configurationJson).scope.maxDepth}|"/><span class="mx-2">·</span><span th:text="|${codec.read(job.configurationJson).scope.maxPages} pages max|"/></div></div><div class="card-footer bg-transparent border-0"><div class="d-flex gap-2"><form th:action="@{/jobs/{id}/start(id=${job.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-outline-primary flex-grow-1"><i class="bi bi-play-fill"></i> Start run</button></form><a class="btn btn-outline-secondary" th:href="@{/jobs/{id}/edit(id=${job.id})}"><i class="bi bi-pencil"></i> Edit</a></div></div></article></div><div th:if="${jobs.empty}" class="empty-state card panel">No crawl jobs configured.</div></div></main></body></html>
