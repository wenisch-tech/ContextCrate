<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Source · ContextCrate</title><link rel="stylesheet" href="/css/contextcrate.css"><script defer src="/js/contextcrate.js"></script></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container-fluid p-4 p-lg-5"><div class="d-flex justify-content-between mb-4"><div><p class="eyebrow" th:text="${source.connectorType}"></p><h1 th:text="${source.name}"></h1><p class="text-secondary" th:text="${source.connectorType.name() == 'GIT' ? sourceConfig.git.repositoryUrl : sourceConfig.website.url}"></p><p class="text-secondary" th:if="${source.description}" th:text="${source.description}"></p></div><div th:if="${crateRole.includes(T(tech.wenisch.contextcrate.domain.CrateMember.Role).EDITOR)}"><a class="btn btn-outline-secondary me-2" th:href="@{/crates/{crateId}/sources/{id}/edit(crateId=${crate.id},id=${source.id})}">Edit source</a><a class="btn btn-primary" th:href="@{/crates/{crateId}/sources/{id}/ingestion-jobs/new(crateId=${crate.id},id=${source.id})}">New ingestion job</a></div></div><div class="card panel"><div class="card-header">Ingestion jobs</div><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Name</th><th>Configuration</th><th></th></tr></thead><tbody><tr th:each="job:${jobs}"><td th:text="${job.name}"></td><td th:text="${source.connectorType.name() == 'GIT' ? 'Ref: '+ingestionCodec.read(job.configurationJson, source.connectorType).git.ref : ingestionCodec.read(job.configurationJson, source.connectorType).webCrawler.scope.seedUrl}"></td><td class="text-end"><form class="d-inline" method="post" th:action="@{/crates/{crateId}/sources/{sourceId}/ingestion-jobs/{jobId}/start(crateId=${crate.id},sourceId=${source.id},jobId=${job.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-primary">Start run</button></form><a class="btn btn-sm btn-outline-secondary ms-2" th:href="@{/crates/{crateId}/sources/{sourceId}/ingestion-jobs/{jobId}/edit(crateId=${crate.id},sourceId=${source.id},jobId=${job.id})}">Edit</a></td></tr><tr th:if="${jobs.empty}"><td colspan="3" class="empty-state">No ingestion jobs yet.</td></tr></tbody></table></div></div></main></body></html>
