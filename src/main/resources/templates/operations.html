<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments :: head('Operations')}"></th:block></head><body class="app-shell" x-data="liveView($el.dataset.crateId)" th:data-crate-id="${crate.id}"><aside th:replace="~{fragments :: sidebar}"></aside><div th:replace="~{fragments :: overlay}"></div><div class="app-main"><header th:replace="~{fragments :: topbar('Operations')}"></header><main class="page"><div class="page-header"><div><p class="eyebrow">Runtime</p><h2 class="page-title">Operations</h2><p class="page-copy">Crate-scoped pipeline pressure, index health, and failed work.</p></div><span class="badge" :class="{'badge-good':connection==='live','badge-warn':connection==='polling'||connection==='stale','badge-bad':connection==='offline'}" x-text="connection"></span></div><div class="grid gap-6 lg:grid-cols-2"><section class="panel"><div class="panel-header">Pipeline work</div><div class="panel-body space-y-3"><template x-for="stage in Object.keys(state?.pipeline||{})"><div class="kv-row"><span x-text="stage.replaceAll('_',' ')"></span><span class="flex gap-3 text-xs"><strong class="text-cyan-500" x-text="state.pipeline[stage].PROCESSING||0"></strong><strong class="text-warn-500" x-text="(state.pipeline[stage].PENDING||0)+(state.pipeline[stage].RETRY_WAITING||0)"></strong><strong class="text-bad-500" x-text="(state.pipeline[stage].FAILED||0)+(state.pipeline[stage].DEAD_LETTERED||0)"></strong></span></div></template><noscript><div class="kv-row" th:each="q:${queueDepth}"><span th:text="${q.key}"></span><strong th:text="${q.value}"></strong></div></noscript></div></section><section class="panel"><div class="panel-header">Index health</div><div class="panel-body"><div class="flex items-center gap-4"><span class="size-3 rounded-full" :class="state?.indexHealth?.healthy?'bg-good-500':'bg-bad-500'"></span><div><strong class="text-white" x-text="state?.indexHealth?.backend" th:text="${indexHealth.backend}"></strong><p class="mt-1 text-xs text-ink-500" x-text="state?.indexHealth?.detail" th:text="${indexHealth.detail}"></p></div><strong class="ml-auto text-2xl tabular-nums" x-text="state?.indexHealth?.documents" th:text="${indexHealth.documents}"></strong></div></div></section><section class="panel lg:col-span-2"><div class="panel-header"><span>Dead letters</span><span class="badge-bad" th:if="${!deadLetters.empty}" th:text="${deadLetters.size()}"></span></div><div class="overflow-x-auto"><table class="data-table"><thead><tr><th>Stage</th><th>ID</th><th>Attempts</th></tr></thead><tbody><tr th:each="m:${deadLetters}"><td th:text="${m.stage}"></td><td class="font-mono text-xs" th:text="${m.id}"></td><td th:text="${m.attempts}"></td></tr><tr th:if="${deadLetters.empty}"><td colspan="3" class="empty-state">No dead-lettered work.</td></tr></tbody></table></div></section></div></main></div></body></html>
