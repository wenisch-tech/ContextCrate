<!doctype html><html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operations · ContextCrate</title><link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/webjars/bootstrap-icons/font/bootstrap-icons.css"><link rel="stylesheet" href="/css/contextcrate.css"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container-fluid p-4 p-lg-5"><p class="eyebrow">RUNTIME</p><h1 class="mb-4">Operations</h1><div class="row g-4"><div class="col-lg-5"><div class="card panel"><div class="card-header">Pipeline queues</div><div class="card-body"><div class="backend-row" th:each="q:${queueDepth}"><span th:text="${q.key}"></span><strong th:text="${q.value}"></strong></div></div></div></div><div class="col-lg-7"><div class="card panel"><div class="card-header">Index health</div><div class="card-body"><div class="d-flex gap-3 align-items-center"><span class="health-dot" th:classappend="${indexHealth.healthy} ? 'healthy' : 'unhealthy'"></span><div><strong th:text="${indexHealth.backend}"></strong><div class="text-secondary small" th:text="${indexHealth.detail}"></div></div><span class="ms-auto fs-3" th:text="${indexHealth.documents}"></span></div></div></div></div><div class="col-12"><div class="card panel"><div class="card-header">Dead letters</div><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Stage</th><th>ID</th><th>Attempts</th></tr></thead><tbody><tr th:each="m:${deadLetters}"><td th:text="${m.stage}"></td><td class="font-monospace small" th:text="${m.id}"></td><td th:text="${m.attempts}"></td></tr><tr th:if="${deadLetters.empty}"><td colspan="3" class="empty-state">No dead-lettered work.</td></tr></tbody></table></div></div></div></div></main></body></html>
