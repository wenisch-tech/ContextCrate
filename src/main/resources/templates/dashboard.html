<!doctype html><html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overview · Harvex</title><link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/webjars/bootstrap-icons/font/bootstrap-icons.css"><link rel="stylesheet" href="/css/harvex.css"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container-fluid p-4 p-lg-5"><div class="d-flex justify-content-between align-items-start mb-4"><div><p class="eyebrow">CONTROL PLANE</p><h1 class="display-6 fw-semibold">Crawling overview</h1><p class="text-secondary">A live view of work moving through Harvex.</p></div><a class="btn btn-primary" href="/jobs/new"><i class="bi bi-plus-lg me-1"></i>New job</a></div><div class="row g-3 mb-4"><div class="col-6 col-xl-3"><div class="metric-card"><span>Jobs</span><strong th:text="${jobs.size()}">0</strong></div></div><div class="col-6 col-xl-3"><div class="metric-card"><span>Runs</span><strong th:text="${runs.size()}">0</strong></div></div><div class="col-6 col-xl-3"><div class="metric-card"><span>Documents</span><strong th:text="${documentCount}">0</strong></div></div><div class="col-6 col-xl-3"><div class="metric-card"><span>Index</span><strong class="fs-5" th:classappend="${indexHealth.healthy} ? 'text-success' : 'text-danger'" th:text="${indexHealth.backend}">Lucene</strong></div></div></div><div class="row g-4"><div class="col-xl-8"><section class="card panel"><div class="card-header d-flex justify-content-between"><span>Recent runs</span><a href="/jobs" class="small">Manage jobs</a></div><div class="table-responsive"><table class="table mb-0 align-middle"><thead><tr><th>Run</th><th>Status</th><th>Started</th></tr></thead><tbody><tr th:each="run:${runs}"><td class="font-monospace small" th:text="${run.id}"></td><td><span class="status-pill" th:text="${run.status}"></span></td><td th:text="${run.startedAt}"></td></tr><tr th:if="${runs.empty}"><td colspan="3" class="empty-state">No runs yet. Create a crawl job to begin.</td></tr></tbody></table></div></section></div><div class="col-xl-4"><section class="card panel mb-4"><div class="card-header">Runtime</div><div class="card-body"><div class="backend-row"><span>Profile</span><code th:text="${properties.profile}"></code></div><div class="backend-row"><span>Queue</span><code th:text="${properties.queue.backend}"></code></div><div class="backend-row"><span>Database</span><code th:text="${properties.database.backend}"></code></div><div class="backend-row"><span>Artifacts</span><code th:text="${properties.artifacts.backend}"></code></div><div class="backend-row"><span>Index</span><code th:text="${properties.index.backend}"></code></div></div></section><section class="card panel"><div class="card-header">Queue depth</div><div class="card-body"><div class="backend-row" th:each="q:${queueDepth}"><span th:text="${q.key}"></span><strong th:text="${q.value}"></strong></div></div></section></div></div></main><script src="/webjars/bootstrap/js/bootstrap.bundle.min.js"></script></body></html>
