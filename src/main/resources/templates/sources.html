<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sources · ContextCrate</title><link rel="stylesheet" href="/css/contextcrate.css"><script defer src="/js/contextcrate.js"></script></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container-fluid p-4 p-lg-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><p class="eyebrow">INGESTION</p><h1>Sources</h1></div><a class="btn btn-primary" th:if="${crateRole.includes(T(tech.wenisch.contextcrate.domain.CrateMember.Role).EDITOR)}" th:href="@{/crates/{id}/sources/new(id=${crate.id})}">New source</a></div><div class="row g-3"><div class="col-lg-6 col-xxl-4" th:each="summary:${sourceSummaries}" th:with="source=${summary.source}"><article class="card panel h-100"><div class="card-body"><div class="d-flex justify-content-between"><h2 class="h5" th:text="${source.name}"></h2><span class="badge text-bg-secondary" th:text="${source.connectorType}"></span></div><p class="text-secondary text-truncate" th:text="${source.connectorType.name() == 'GIT' ? sourceCodec.read(source.configurationJson, source.connectorType).git.repositoryUrl : sourceCodec.read(source.configurationJson, source.connectorType).website.url}"></p><p class="small text-secondary" th:if="${source.description}" th:text="${source.description}"></p><div class="crate-stats mt-3"><a class="crate-stat" th:href="@{/crates/{crateId}/documents(crateId=${crate.id},sourceId=${source.id})}"><strong th:text="${summary.documents}"></strong><span>DOCUMENTS</span></a><div class="crate-stat"><strong th:text="${summary.chunks}"></strong><span>CHUNKS</span></div><div class="crate-stat"><strong th:text="${summary.jobs}"></strong><span>JOBS</span></div></div><div class="crate-card__footer mt-3"><span th:if="${summary.latestRun == null}">Not run yet</span><span th:if="${summary.latestRun != null}" class="d-flex align-items-center gap-2"><span class="status-pill" th:text="${summary.latestRun.status}"></span><span th:text="${summary.latestRun.finishedAt != null ? summary.latestRun.finishedAt : summary.latestRun.startedAt}"></span></span></div></div><div class="card-footer bg-transparent border-0"><a class="btn btn-outline-primary" th:href="@{/crates/{crateId}/sources/{id}(crateId=${crate.id},id=${source.id})}">Open</a></div></article></div><div th:if="${sourceSummaries.empty}" class="empty-state card panel">No sources configured.</div></div></main></body></html>
