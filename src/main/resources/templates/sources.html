<!doctype html><html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sources · ContextCrate</title><link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/webjars/bootstrap-icons/font/bootstrap-icons.css"><link rel="stylesheet" href="/css/contextcrate.css"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container-fluid p-4 p-lg-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><p class="eyebrow">INGESTION</p><h1>Sources</h1></div><a class="btn btn-primary" th:href="@{/crates/{id}/sources/new(id=${crate.id})}">New source</a></div><div class="row g-3"><div class="col-lg-6 col-xxl-4" th:each="source:${sources}"><article class="card panel h-100"><div class="card-body"><div class="d-flex justify-content-between"><h2 class="h5" th:text="${source.name}"></h2><span class="badge text-bg-secondary" th:text="${source.connectorType}"></span></div><p class="text-secondary text-truncate" th:text="${source.connectorType.name() == 'GIT' ? sourceCodec.read(source.configurationJson, source.connectorType).git.repositoryUrl : sourceCodec.read(source.configurationJson, source.connectorType).website.url}"></p><p class="small text-secondary" th:if="${source.description}" th:text="${source.description}"></p><div class="small text-secondary" th:text="|${sourceService.jobCount(source.id)} ingestion jobs|"></div></div><div class="card-footer bg-transparent border-0"><a class="btn btn-outline-primary" th:href="@{/crates/{crateId}/sources/{id}(crateId=${crate.id},id=${source.id})}">Open</a></div></article></div><div th:if="${sources.empty}" class="empty-state card panel">No sources configured.</div></div></main></body></html>
