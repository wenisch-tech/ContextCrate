<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments :: head('Chat')}"></th:block></head>
<body class="app-shell"><aside th:replace="~{fragments :: sidebar}"></aside><div th:replace="~{fragments :: overlay}"></div>
<div class="app-main"><header th:replace="~{fragments :: topbar('Chat')}"></header><div th:replace="~{fragments :: elevation}"></div>
<main id="chat-workspace" class="page" th:data-crate-id="${crate.id}">
  <div class="page-header"><div><p class="eyebrow">Grounded answers</p><h2 class="page-title">Chat with this crate</h2><p class="page-copy">Ask questions across indexed content. Answers stream live and retain citations to their source chunks.</p></div></div>
  <section class="panel"><div class="panel-body">
    <form id="answer-form" class="grid gap-3 md:grid-cols-[1fr_auto]"><div class="field"><label class="field-label" for="answer-question">Question</label><input id="answer-question" class="input" required maxlength="8000" autocomplete="off" placeholder="What do the indexed documents say about…"></div><div class="flex items-end gap-2"><button id="cancel-answer" class="btn-secondary hidden" type="button">Cancel</button><button class="btn-primary" type="submit"><i data-lucide="message-square" class="size-4"></i>Ask</button></div></form>
    <div id="answer-status" class="mt-4 text-xs text-ink-500" role="status"></div><div id="answer-verification-status" class="alert-info mt-3 hidden" role="status"></div>
    <div class="mt-5 grid gap-5 xl:grid-cols-[minmax(0,2fr)_minmax(18rem,1fr)]"><article id="answer-text" class="prose-answer min-h-40 rounded-xl border border-ink-700/60 bg-ink-950/35 p-5"><p class="text-sm text-ink-500">The grounded answer will appear here.</p></article><aside><h3 class="mb-3 text-sm font-semibold text-white">Sources</h3><div id="answer-sources" class="space-y-3"><p class="text-sm text-ink-500">Citations will appear as sources are retrieved.</p></div></aside></div>
  </div></section>
</main></div>
<script th:inline="none">
(()=>{const root=document.getElementById('chat-workspace'),form=document.getElementById('answer-form'),question=document.getElementById('answer-question'),status=document.getElementById('answer-status'),verification=document.getElementById('answer-verification-status'),answer=document.getElementById('answer-text'),sources=document.getElementById('answer-sources'),cancel=document.getElementById('cancel-answer');let controller,markdown='',sourceList=[];const safeUrl=value=>{try{const url=new URL(value,location.origin);return ['http:','https:'].includes(url.protocol)?url.href:null}catch{return null}};const inline=(parent,value)=>{const pattern=/(\[(?:SOURCE\s+)?\d+\]|\*\*[^*]+\*\*|`[^`]+`)/g;let last=0;for(const match of value.matchAll(pattern)){parent.append(document.createTextNode(value.slice(last,match.index)));const part=match[0],citation=part.match(/^\[(?:SOURCE\s+)?(\d+)\]$/);if(citation&&sourceList.some(source=>source.citation===Number(citation[1]))){const link=document.createElement('a');link.href='#citation-'+citation[1];link.textContent='['+citation[1]+']';link.className='text-brand-400';parent.append(link)}else{const node=document.createElement(part.startsWith('**')?'strong':'code');node.textContent=part.replace(/^(\*\*|`)|(`|\*\*)$/g,'');parent.append(node)}last=match.index+part.length}parent.append(document.createTextNode(value.slice(last)))};const render=()=>{answer.replaceChildren();for(const line of markdown.replace(/\r/g,'').split('\n')){if(!line.trim())continue;const heading=line.match(/^(#{1,3})\s+(.+)$/),node=document.createElement(heading?'h'+heading[1].length:'p');inline(node,heading?heading[2]:line);answer.append(node)}};const renderSources=items=>{sourceList=items;sources.replaceChildren();for(const source of items){const item=document.createElement('article'),title=document.createElement('div'),link=document.createElement('a'),detail=document.createElement('p');item.id='citation-'+source.citation;item.className='rounded-lg border border-ink-700/60 bg-ink-950/35 p-3';title.className='text-sm font-semibold text-white';title.textContent=`[${source.citation}] ${source.title||source.sourceUri}`;link.className='mt-1 block break-all text-xs text-brand-400';link.textContent=source.sourceUri;const href=safeUrl(source.sourceUri?.replace(/^git\+/,''));if(href){link.href=href;link.target='_blank';link.rel='noopener noreferrer'}detail.className='mt-2 text-xs text-ink-500';detail.textContent=source.snippet;item.append(title,link,detail);sources.append(item)}render()};cancel.addEventListener('click',()=>controller?.abort());form.addEventListener('submit',async event=>{event.preventDefault();controller?.abort();controller=new AbortController();markdown='';sourceList=[];answer.replaceChildren();sources.replaceChildren();verification.classList.add('hidden');cancel.classList.remove('hidden');status.textContent='Finding sources…';try{const response=await fetch(`/api/v1/crates/${root.dataset.crateId}/answers`,{method:'POST',headers:{'Content-Type':'application/json',Accept:'text/event-stream'},body:JSON.stringify({question:question.value}),signal:controller.signal});if(!response.ok)throw new Error(response.status===503?'Answer generation is not configured.':'Unable to generate an answer.');const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';status.textContent='Generating answer…';while(true){const result=await reader.read();if(result.done)break;buffer+=decoder.decode(result.value,{stream:true});const events=buffer.split('\n\n');buffer=events.pop();for(const raw of events){let name='',data='';for(const line of raw.split('\n')){if(line.startsWith('event:'))name=line.slice(6).trim();if(line.startsWith('data:'))data+=line.slice(5).trim()}if(!data)continue;const payload=JSON.parse(data);if(name==='sources')renderSources(payload);if(name==='verification'){verification.textContent='Verification: '+payload.status;verification.classList.remove('hidden')}if(name==='delta'){markdown+=payload.text;render()}if(name==='complete')status.textContent='Complete.';if(name==='error')throw new Error(payload.error)}}}catch(error){status.textContent=error.name==='AbortError'?'Cancelled.':error.message}finally{cancel.classList.add('hidden')}})})();
</script></body></html>
