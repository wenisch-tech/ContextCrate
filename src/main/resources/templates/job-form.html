<!doctype html><html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New crawl job · Harvex</title><link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/webjars/bootstrap-icons/font/bootstrap-icons.css"><link rel="stylesheet" href="/css/harvex.css"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container py-5"><p class="eyebrow">NEW CONFIGURATION</p><h1 class="mb-4">Create a crawl job</h1><form action="/jobs" method="post" class="card panel"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="card-body p-4">
<h2 class="section-title"><span>1</span> Scope</h2><div class="row g-3"><div class="col-md-6"><label class="form-label" for="name">Job name</label><input id="name" class="form-control" name="name" placeholder="Documentation crawl" required></div><div class="col-md-6"><label class="form-label" for="seedUrl">Seed URL</label><input id="seedUrl" class="form-control" name="seedUrl" type="url" placeholder="https://example.com/docs" required></div><div class="col-md-5"><label class="form-label" for="allowedHost">Allowed host</label><input id="allowedHost" class="form-control" name="allowedHost" placeholder="example.com" required></div><div class="col-md-2"><label class="form-label" for="maxDepth">Depth</label><input id="maxDepth" class="form-control" name="maxDepth" type="number" min="0" value="3"></div><div class="col-md-3"><label class="form-label" for="maxPages">Maximum pages</label><input id="maxPages" class="form-control" name="maxPages" type="number" min="1" value="1000"></div><div class="col-md-2 d-flex align-items-end"><div class="form-check mb-2"><input class="form-check-input" name="allowSubdomains" type="checkbox" value="true" id="subdomains"><label class="form-check-label" for="subdomains">Subdomains</label></div></div></div><hr class="my-4">
<h2 class="section-title"><span>2</span> Politeness</h2><div class="row g-3"><div class="col-md-4"><label class="form-label" for="userAgent">User agent</label><input id="userAgent" class="form-control" name="userAgent" value="HarvexBot/0.1"></div><div class="col-md-4"><label class="form-label" for="contact">Operator contact</label><input id="contact" class="form-control" name="contact" placeholder="crawler@example.com"></div><div class="col-md-2"><label class="form-label" for="delayMillis">Delay (ms)</label><input id="delayMillis" class="form-control" name="delayMillis" type="number" min="0" value="1000"></div><div class="col-md-2"><label class="form-label" for="timeoutMillis">Timeout (ms)</label><input id="timeoutMillis" class="form-control" name="timeoutMillis" type="number" min="100" value="15000"></div><div class="col-12"><div class="form-check"><input class="form-check-input" name="honorRobots" value="true" type="checkbox" id="robots" checked><label class="form-check-label" for="robots">Honor robots.txt (recommended)</label></div></div></div><hr class="my-4">
<h2 class="section-title"><span>3</span> Reliability</h2><div class="row g-3"><div class="col-md-3"><label class="form-label" for="maxAttempts">Attempts</label><input id="maxAttempts" class="form-control" name="maxAttempts" type="number" min="1" value="3"></div><div class="col-md-3"><label class="form-label" for="backoffMillis">Initial backoff (ms)</label><input id="backoffMillis" class="form-control" name="backoffMillis" type="number" min="0" value="1000"></div><div class="col-md-3"><label class="form-label" for="maxBodyMegabytes">Maximum body (MB)</label><input id="maxBodyMegabytes" class="form-control" name="maxBodyMegabytes" type="number" min="1" value="10"></div><div class="col-md-3"><label class="form-label" for="renderMode">Rendering</label><select id="renderMode" class="form-select" name="renderMode"><option>AUTO</option><option>HTTP_ONLY</option><option>BROWSER_ONLY</option></select></div></div><hr class="my-4">
  <h2 class="section-title"><span>4</span> Output</h2><div class="row g-3"><div class="col-md-3"><label class="form-label" for="retentionDays">Raw retention (days)</label><input id="retentionDays" class="form-control" name="retentionDays" type="number" min="0" value="30"></div><div class="col-md-3"><label class="form-label" for="contentSelector">Content selector</label><input id="contentSelector" class="form-control" name="contentSelector" placeholder="main, article"></div><div class="col-md-3"><label class="form-label" for="chunkSize">Chunk size</label><input id="chunkSize" class="form-control" name="chunkSize" type="number" min="200" value="2000"></div><div class="col-md-3"><label class="form-label" for="chunkOverlap">Chunk overlap</label><input id="chunkOverlap" class="form-control" name="chunkOverlap" type="number" min="0" value="200"></div></div><hr class="my-4">
  <h2 class="section-title"><span>5</span> Authentication</h2><div class="row g-3"><div class="col-md-4"><label class="form-label" for="authUsername">Username</label><input id="authUsername" class="form-control" name="authUsername" placeholder="Username for login"></div><div class="col-md-4"><label class="form-label" for="authPassword">Password</label><input id="authPassword" class="form-control" name="authPassword" type="password" placeholder="Password for login"></div><div class="col-md-3"><label class="form-label" for="authLoginPageUrl">Login page URL</label><input id="authLoginPageUrl" class="form-control" name="authLoginPageUrl" placeholder="https://example.com/login"></div><div class="col-md-1 d-flex align-items-end"><div class="form-check mb-2"><input class="form-check-input" name="authDirectLogin" type="checkbox" value="true" id="directLogin"><label class="form-check-label" for="directLogin">Direct login</label></div></div></div>
</div><div class="card-footer d-flex justify-content-end gap-2 p-3"><a class="btn btn-outline-secondary" href="/jobs">Cancel</a><button class="btn btn-primary">Create job</button></div></form></main></body></html>
