<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change password · ContextCrate</title>
<link rel="stylesheet" href="/css/contextcrate.css"><script defer src="/js/contextcrate.js"></script></head>
<body class="login-body"><main class="login-card card"><form method="post" action="/change-password" class="card-body p-5">
<h1 class="h3">Choose a new password</h1><p class="text-secondary">Temporary passwords must be replaced before continuing.</p>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label class="form-label">Current password</label><input class="form-control mb-3" type="password" name="currentPassword" required>
<label class="form-label">New password</label><input class="form-control mb-3" type="password" name="newPassword" minlength="12" required>
<label class="form-label">Confirm new password</label><input class="form-control mb-4" type="password" name="confirmation" minlength="12" required>
<button class="btn btn-primary w-100">Change password</button></form></main></body></html>
