name: contextcrate

x-contextcrate: &contextcrate
  image: ghcr.io/wenisch-tech/contextcrate:latest
  environment: &environment
    SPRING_PROFILES_ACTIVE: distributed
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/contextcrate
    SPRING_DATASOURCE_USERNAME: contextcrate
    SPRING_DATASOURCE_PASSWORD: contextcrate
    SPRING_RABBITMQ_HOST: rabbitmq
    AWS_ACCESS_KEY_ID: contextcrate
    AWS_SECRET_ACCESS_KEY: contextcrate-secret
    S3_ENDPOINT: http://minio:9000
    S3_BUCKET: contextcrate
    OPENSEARCH_ENDPOINT: http://opensearch:9200
    CONTEXTCRATE_ADMIN_EMAIL: ${CONTEXTCRATE_ADMIN_EMAIL:-admin@contextcrate.local}
    CONTEXTCRATE_ADMIN_PASSWORD: ${CONTEXTCRATE_ADMIN_PASSWORD:-admin}
    CONTEXTCRATE_EMBEDDINGS_PROVIDER: ${CONTEXTCRATE_EMBEDDINGS_PROVIDER:-local}
    CONTEXTCRATE_EMBEDDINGS_LOCAL_CACHE_PATH: /app/data/models
    CONTEXTCRATE_EMBEDDINGS_OPENAI_COMPATIBLE_BASE_URL: ${CONTEXTCRATE_EMBEDDINGS_OPENAI_COMPATIBLE_BASE_URL:-}
    CONTEXTCRATE_EMBEDDINGS_OPENAI_COMPATIBLE_MODEL: ${CONTEXTCRATE_EMBEDDINGS_OPENAI_COMPATIBLE_MODEL:-}
    CONTEXTCRATE_EMBEDDINGS_OPENAI_COMPATIBLE_API_KEY: ${CONTEXTCRATE_EMBEDDINGS_OPENAI_COMPATIBLE_API_KEY:-}
    CONTEXTCRATE_EMBEDDINGS_OPENAI_COMPATIBLE_AUTOMATIC_LIMIT_RECOVERY: ${CONTEXTCRATE_EMBEDDINGS_OPENAI_COMPATIBLE_AUTOMATIC_LIMIT_RECOVERY:-true}
    CONTEXTCRATE_ANSWERING_ENABLED: ${CONTEXTCRATE_ANSWERING_ENABLED:-false}
    CONTEXTCRATE_ANSWERING_OPENAI_COMPATIBLE_BASE_URL: ${CONTEXTCRATE_ANSWERING_OPENAI_COMPATIBLE_BASE_URL:-}
    CONTEXTCRATE_ANSWERING_OPENAI_COMPATIBLE_MODEL: ${CONTEXTCRATE_ANSWERING_OPENAI_COMPATIBLE_MODEL:-}
    CONTEXTCRATE_ANSWERING_OPENAI_COMPATIBLE_API_KEY: ${CONTEXTCRATE_ANSWERING_OPENAI_COMPATIBLE_API_KEY:-}
  depends_on: [postgres, rabbitmq, minio, opensearch]
services:
  control-plane:
    <<: *contextcrate
    ports: ["8080:8080"]
    environment: { <<: *environment, CONTEXTCRATE_ROLE: control-plane }
  source-web:
    <<: *contextcrate
    environment: { <<: *environment, CONTEXTCRATE_ROLE: source-web }
  source-git:
    <<: *contextcrate
    environment: { <<: *environment, CONTEXTCRATE_ROLE: source-git }
  crawler-browser:
    <<: *contextcrate
    image: ghcr.io/wenisch-tech/contextcrate-browser:latest
    environment: { <<: *environment, CONTEXTCRATE_ROLE: crawler-browser }
  parser:
    <<: *contextcrate
    environment: { <<: *environment, CONTEXTCRATE_ROLE: parser }
  indexer:
    <<: *contextcrate
    environment: { <<: *environment, CONTEXTCRATE_ROLE: indexer }
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: contextcrate, POSTGRES_USER: contextcrate, POSTGRES_PASSWORD: contextcrate }
    volumes: ["postgres:/var/lib/postgresql/data"]
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ["15672:15672"]
    volumes: ["rabbitmq:/var/lib/rabbitmq"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: contextcrate, MINIO_ROOT_PASSWORD: contextcrate-secret }
    ports: ["9001:9001"]
    volumes: ["minio:/data"]
  opensearch:
    image: opensearchproject/opensearch:3.2.0
    environment: { discovery.type: single-node, DISABLE_SECURITY_PLUGIN: "true", OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m" }
    volumes: ["opensearch:/usr/share/opensearch/data"]
volumes: { postgres: {}, rabbitmq: {}, minio: {}, opensearch: {} }
