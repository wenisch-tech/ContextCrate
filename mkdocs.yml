site_name: ContextCrate
site_description: Self-hosted crawling and indexing platform
repo_url: https://github.com/wenisch-tech/ContextCrate
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: cyan
nav:
  - Overview: index.md
  - Crates: crates.md
  - Authorization: authorization.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Chunking: chunking.md
  - Embeddings: embeddings.md
  - Reranking: reranking.md
  - Answers: answers.md
  - Features:
    - Retrieval: features/retrieval.md
    - Grading: features/grading.md
    - Answer verification: features/answer-verification.md
  - Pipeline: pipeline.md
  - Security: security.md
  - Installation:
    - Overview: installation/README.md
    - Docker: installation/docker.md
    - Docker Compose: installation/compose.md
    - Kubernetes: installation/kubernetes.md
    - JAR: installation/jar.md
  - Deployment Notes: deployment.md
  - Backup & migration: backup-migration.md
  - Upgrade from Harvex: upgrade-from-harvex.md
  - API: api.md
  - Integrations:
    - MCP server: integrations/mcp.md
    - OpenAI-compatible API: integrations/openai.md
  - Operations:
    - Overview: operations.md
    - Administration: operations/administration.md
    - OIDC with Keycloak: operations/oidc.md
  - Tutorials: tutorials.md
  - Roadmap: roadmap.md
  - Troubleshooting: troubleshooting.md
markdown_extensions:
  - admonition
  - tables
  - toc
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
