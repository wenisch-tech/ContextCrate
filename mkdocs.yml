site_name: ContextCrate
site_description: Self-hosted crawling and indexing platform
repo_url: https://github.com/wenisch-tech/ContextCrate
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: cyan
nav:
  - Overview: index.md
  - Crates: crates.md
  - Authorization: authorization.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Chunking: chunking.md
  - Embeddings: embeddings.md
  - Reranking: reranking.md
  - Answers: answers.md
  - Pipeline: pipeline.md
  - Security: security.md
  - Deployment: deployment.md
  - Backup & migration: backup-migration.md
  - Upgrade from Harvex: upgrade-from-harvex.md
  - API: api.md
  - Operations: operations.md
  - Tutorials: tutorials.md
  - Roadmap: roadmap.md
  - Troubleshooting: troubleshooting.md
markdown_extensions:
  - admonition
  - tables
  - toc
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
