name: Docker
on:
  workflow_call:
    inputs:
      version: { required: true, type: string }
      push: { required: true, type: boolean }
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: harvex, file: Dockerfile }
          - { name: harvex-browser, file: Dockerfile-browser }
    permissions: { contents: read, packages: write, pull-requests: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25', cache: maven }
      - run: mvn -B -DskipTests package
      - uses: docker/setup-buildx-action@v4
      - if: inputs.push
        uses: docker/login-action@v4
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: |
            ghcr.io/wenisch-tech/${{ matrix.name }}:${{ inputs.version }}
            ghcr.io/wenisch-tech/${{ matrix.name }}:latest
          build-args: |
            BUILD_VERSION=${{ inputs.version }}
            BUILD_REVISION=${{ github.sha }}
      # Keep the PR scan on the primary image. The browser image is an extension
      # of it and publishing two large vulnerability reports on every PR is noisy.
      - name: Set up Trivy
        if: matrix.name == 'harvex'
        uses: aquasecurity/setup-trivy@v0.2.6
      - name: Run Trivy scan
        if: matrix.name == 'harvex'
        shell: bash
        run: |
          set +e
          image="ghcr.io/wenisch-tech/${{ matrix.name }}:${{ inputs.version }}"
          status=1
          for attempt in 1 2 3; do
            trivy image \
              --format table \
              --output trivy-report.txt \
              --scanners vuln \
              --vuln-type os,library \
              --severity CRITICAL,HIGH,MEDIUM \
              "$image"
            status=$?
            if [ "$status" -eq 0 ]; then
              break
            fi
            sleep 10
          done
          if [ ! -s trivy-report.txt ]; then
            {
              echo "Trivy scan could not complete after retries."
              echo "Image: $image"
              echo "Exit status: $status"
            } > trivy-report.txt
          fi
          exit 0
      - name: Upload Trivy report
        if: always() && matrix.name == 'harvex'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ github.run_id }}
          path: trivy-report.txt
          if-no-files-found: warn
      - name: Add Trivy report to pull request
        if: always() && github.event_name == 'pull_request' && matrix.name == 'harvex'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let report = fs.readFileSync('trivy-report.txt', 'utf8');
            const maxLength = 60000;
            if (report.length > maxLength) {
              report = `${report.slice(0, maxLength)}\n… output truncated …`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## Trivy vulnerability report',
                '',
                'Image: `ghcr.io/wenisch-tech/${{ matrix.name }}:${{ inputs.version }}`',
                '',
                '```text',
                report,
                '```'
              ].join('\n')
            });
      - if: inputs.push
        uses: actions/attest-build-provenance@v4
        with: { subject-name: 'ghcr.io/wenisch-tech/${{ matrix.name }}', subject-digest: '${{ steps.build.outputs.digest }}', push-to-registry: true }
