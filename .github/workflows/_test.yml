name: Test
on: { workflow_call: {} }
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions: { contents: read, checks: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '25', cache: maven }
      - name: Verify
        run: mvn -B verify
      - name: Test report
        if: always()
        uses: dorny/test-reporter@v3
        with: { name: Maven Tests, path: 'target/surefire-reports/*.xml', reporter: java-junit }
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/site/jacoco
