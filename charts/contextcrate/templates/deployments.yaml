{{- range $role, $settings := .Values.roles }}
{{- if $settings.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "contextcrate.fullname" $ }}-{{ $role }}
  labels:
    {{- include "contextcrate.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  replicas: {{ $settings.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $role }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: contextcrate, app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $role }} }
      annotations: {{- toYaml $.Values.podAnnotations | nindent 8 }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532 }
      containers:
        - name: contextcrate
          image: "{{ if eq $role "crawler-browser" }}{{ $.Values.image.browserRepository }}{{ else }}{{ $.Values.image.repository }}{{ end }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: {{ $.Values.profile | quote }} }
            - { name: CONTEXTCRATE_ROLE, value: {{ $role | quote }} }
            - { name: CONTEXTCRATE_EMBEDDINGS_ENABLED, value: {{ $.Values.embeddings.enabled | quote }} }
            - { name: CONTEXTCRATE_EMBEDDINGS_PROVIDER, value: {{ $.Values.embeddings.provider | quote }} }
            - { name: CONTEXTCRATE_EMBEDDINGS_LOCAL_CACHE_PATH, value: {{ $.Values.embeddings.local.cachePath | quote }} }
            - { name: CONTEXTCRATE_EMBEDDINGS_LOCAL_MODEL_PATH, value: {{ $.Values.embeddings.local.modelPath | quote }} }
            - { name: CONTEXTCRATE_EMBEDDINGS_OPENAI_COMPATIBLE_BASE_URL, value: {{ $.Values.embeddings.openaiCompatible.baseUrl | quote }} }
            - { name: CONTEXTCRATE_EMBEDDINGS_OPENAI_COMPATIBLE_MODEL, value: {{ $.Values.embeddings.openaiCompatible.model | quote }} }
            - { name: CONTEXTCRATE_EMBEDDINGS_OPENAI_COMPATIBLE_DIMENSIONS, value: {{ $.Values.embeddings.openaiCompatible.dimensions | quote }} }
            - { name: CONTEXTCRATE_EMBEDDINGS_OPENAI_COMPATIBLE_AUTOMATIC_LIMIT_RECOVERY, value: {{ $.Values.embeddings.openaiCompatible.automaticLimitRecovery | quote }} }
            - { name: CONTEXTCRATE_ANSWERING_ENABLED, value: {{ $.Values.answering.enabled | quote }} }
            - { name: CONTEXTCRATE_ANSWERING_OPENAI_COMPATIBLE_BASE_URL, value: {{ $.Values.answering.openaiCompatible.baseUrl | quote }} }
            - { name: CONTEXTCRATE_ANSWERING_OPENAI_COMPATIBLE_MODEL, value: {{ $.Values.answering.openaiCompatible.model | quote }} }
            {{- if $.Values.embeddings.openaiCompatible.apiKeySecret }}
            - name: CONTEXTCRATE_EMBEDDINGS_OPENAI_COMPATIBLE_API_KEY
              valueFrom: { secretKeyRef: { name: {{ $.Values.embeddings.openaiCompatible.apiKeySecret }}, key: api-key } }
            {{- end }}
            {{- if $.Values.answering.openaiCompatible.apiKeySecret }}
            - name: CONTEXTCRATE_ANSWERING_OPENAI_COMPATIBLE_API_KEY
              valueFrom: { secretKeyRef: { name: {{ $.Values.answering.openaiCompatible.apiKeySecret }}, key: api-key } }
            {{- end }}
            {{- range $name, $value := $.Values.env }}
            - { name: {{ $name }}, value: {{ $value | quote }} }
            {{- end }}
            {{- range $name, $_ := $.Values.secrets }}
            - name: {{ $name }}
              valueFrom: { secretKeyRef: { name: {{ include "contextcrate.fullname" $ }}, key: {{ $name }} } }
            {{- end }}
          ports: [{ name: http, containerPort: 8080 }]
          startupProbe: { httpGet: { path: /actuator/health, port: http }, periodSeconds: 5, failureThreshold: 30 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, periodSeconds: 10 }
          resources: {{- toYaml $.Values.resources | nindent 12 }}
          {{- if $.Values.persistence.enabled }}
          volumeMounts:
            - { name: data, mountPath: /app/data }
          {{- if $.Values.embeddings.local.modelPathMount }}
            - { name: embedding-model, mountPath: {{ $.Values.embeddings.local.modelPath | quote }}, readOnly: true }
          {{- end }}
          {{- end }}
      {{- if $.Values.persistence.enabled }}
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: {{ include "contextcrate.fullname" $ }} } }
      {{- if $.Values.embeddings.local.modelPathMount }}
        - { name: embedding-model, persistentVolumeClaim: { claimName: {{ $.Values.embeddings.local.modelPathMount }} } }
      {{- end }}
      {{- end }}
{{- end }}
{{- end }}
