profile: standalone
image:
  repository: ghcr.io/wenisch-tech/contextcrate
  browserRepository: ghcr.io/wenisch-tech/contextcrate-browser
  tag: "0.1.173"
  pullPolicy: IfNotPresent
roles:
  all: { enabled: true, replicas: 1 }
  control-plane: { enabled: false, replicas: 1 }
  source-web: { enabled: false, replicas: 1 }
  source-git: { enabled: false, replicas: 1 }
  crawler-browser: { enabled: false, replicas: 1 }
  parser: { enabled: false, replicas: 1 }
  indexer: { enabled: false, replicas: 1 }
service: { type: ClusterIP, port: 8080 }
ingress: { enabled: false, className: "", host: contextcrate.example.com, tls: [] }
persistence: { enabled: true, storageClassName: "", accessMode: ReadWriteOnce, size: 10Gi }
resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "2", memory: 2Gi }
env: {}
secrets: {}
embeddings:
  enabled: true
  provider: local
  local:
    cachePath: /app/data/models
    modelPath: /models
    # Set modelPathMount when supplying a pre-downloaded compatible model bundle.
    modelPathMount: ""
  openaiCompatible:
    baseUrl: ""
    model: ""
    apiKeySecret: ""
    dimensions: 1536
    automaticLimitRecovery: true
answering:
  enabled: false
  openaiCompatible:
    baseUrl: ""
    model: ""
    apiKeySecret: ""
podAnnotations: {}
serviceMonitor: { enabled: false, interval: 30s }
