services:
  harvex:
    build: .
    ports: ["8080:8080"]
    environment:
      HARVEX_ADMIN_PASSWORD: ${HARVEX_ADMIN_PASSWORD:-admin}
    volumes:
      - harvex-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  harvex-data:
