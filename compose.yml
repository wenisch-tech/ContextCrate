name: contextcrate

services:
  contextcrate:
    build: .
    ports: ["8080:8080"]
    environment:
      CONTEXTCRATE_ADMIN_PASSWORD: ${CONTEXTCRATE_ADMIN_PASSWORD:-admin}
    volumes:
      - contextcrate-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  contextcrate-data:
